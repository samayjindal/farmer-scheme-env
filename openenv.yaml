name: FarmerSchemeEnv
description: AI environment for farmer scheme recommendation
version: "1.0"

environment:
  entry_point: env:app

observation_space:
  type: object
  properties:
    query:
      type: string

action_space:
  type: object
  properties:
    scheme:
      type: string
    explanation:
      type: string

reward:
  type: float
  range: [-1, 2]

tasks:
  - id: easy
    description: Basic financial help
  - id: medium
    description: Crop damage
  - id: hard
    description: Multi-condition query
